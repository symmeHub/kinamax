[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kinamax"
version = "0.1.0"
description = "Kinamax Python package"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["kinamax"]

[project.urls]
Homepage = "https://github.com/lcharleux/kinamax"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kinamax*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
docs = [
    "sphinx>=7.0",
    "myst-parser>=2.0",
    "myst-nb>=1.1",
    "jupytext>=1.16",
    "jax[cpu]>=0.4",
    "diffrax>=0.5",
    "numpy>=1.24",
    "polars>=0.20",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "ipympl>=0.9",
    "ipywidgets>=8.0",
    "plotly>=5.0",
]
dev = [
    "pytest>=7.0",
    "sphinx>=7.0",
    "myst-parser>=2.0",
    "myst-nb>=1.1",
    "jupytext>=1.16",
    "sphinx-autobuild>=2021.3.14",
    "matplotlib>=3.8",
    "ipympl>=0.9",
    "ipywidgets>=8.0",
    "plotly>=5.0",
]
